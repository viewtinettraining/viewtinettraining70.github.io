<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%" style="background-color: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131c2e" stroke-width="0.7"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-gui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#240e02" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#170933" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-db-prim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#02281e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-db-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#032b45" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#090d16"/>
  <rect width="1100" height="820" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="1020" height="50" rx="8" fill="url(#hdr-grad)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="26" cy="25" r="6" fill="#38bdf8"/>
    <text x="44" y="31" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Viewtinet 7.X — High Availability &amp; Clustered Resiliency Architecture</text>
    <rect x="830" y="13" width="176" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="918" y="29" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">CARRIER-GRADE RESILIENCY</text>
  </g>

  <!-- ==================== 1. USERS & LOAD BALANCING ==================== -->
  <g transform="translate(40, 90)">
    <!-- Users Box -->
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="360" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <circle cx="28" cy="27" r="12" fill="#334155"/>
      <text x="28" y="32" font-size="14" fill="#94a3b8" text-anchor="middle">👥</text>
      <text x="54" y="24" font-size="13" font-weight="700" fill="#f8fafc">Enterprise Users &amp; NOC Operators</text>
      <text x="54" y="40" font-size="11" fill="#94a3b8">HTTPS Web Sessions • REST API Integration Clients</text>
    </g>

    <!-- Arrow to VIP -->
    <line x1="510" y1="54" x2="510" y2="76" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="505,76 510,83 515,76" fill="#38bdf8"/>

    <!-- Load Balancer (VIP) -->
    <g transform="translate(360, 84)">
      <rect x="0" y="0" width="300" height="42" rx="21" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="150" y="26" font-size="12" font-weight="700" fill="#f0f9ff" text-anchor="middle">Enterprise Load Balancer (VIP / Reverse Proxy)</text>
    </g>
  </g>

  <!-- Arrow from VIP to GUI Tier -->
  <g>
    <line x1="550" y1="216" x2="550" y2="242" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="545,242 550,249 555,242" fill="#f59e0b"/>
  </g>

  <!-- ==================== 2. TIER 1: WEB & GUI CLUSTER ==================== -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="1020" height="114" rx="10" fill="url(#box-gui)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="12" width="280" height="24" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#fef3c7" letter-spacing="0.5">TIER 1: WEB &amp; GUI CLUSTER (ACTIVE-ACTIVE)</text>
    <text x="990" y="29" font-size="11" font-weight="600" fill="#fde68a" text-anchor="end">Seamless Operator Session Failover</text>

    <!-- Sub-Cards -->
    <g transform="translate(16, 44)">
      <!-- Node A -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="484" height="58" rx="6" fill="url(#card-grad)" stroke="#b45309" stroke-width="1"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#fffbeb">Viewtisight &amp; Viewtimanager Web — Node 1 (Active)</text>
        <text x="14" y="42" font-size="11" fill="#cbd5e1">• Multi-Layer Dashboards • Card Builder • Asset Management UI</text>
      </g>

      <!-- Sync arrow in between -->
      <line x1="488" y1="29" x2="498" y2="29" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>

      <!-- Node B -->
      <g transform="translate(504, 0)">
        <rect x="0" y="0" width="484" height="58" rx="6" fill="url(#card-grad)" stroke="#b45309" stroke-width="1"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#fffbeb">Viewtisight &amp; Viewtimanager Web — Node 2 (Active)</text>
        <text x="14" y="42" font-size="11" fill="#cbd5e1">• Multi-Layer Dashboards • Card Builder • Asset Management UI</text>
      </g>
    </g>
  </g>

  <!-- Arrow from GUI to Backend -->
  <g>
    <line x1="550" y1="364" x2="550" y2="390" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="545,390 550,397 555,390" fill="#8b5cf6"/>
    <rect x="460" y="372" width="180" height="16" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="550" y="384" font-size="9" font-weight="600" fill="#c4b5fd" text-anchor="middle">Internal Core APIs &amp; RBAC ↓</text>
  </g>

  <!-- ==================== 3. TIER 2: BACKEND & GOVERNANCE ==================== -->
  <g transform="translate(40, 398)">
    <rect x="0" y="0" width="1020" height="114" rx="10" fill="url(#box-backend)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="16" y="12" width="310" height="24" rx="4" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#ede9fe" letter-spacing="0.5">TIER 2: BACKEND &amp; CORE GOVERNANCE CLUSTER</text>
    <text x="990" y="29" font-size="11" font-weight="600" fill="#ddd6fe" text-anchor="end">Distributed AAA &amp; Database CRUD</text>

    <!-- Sub-Cards -->
    <g transform="translate(16, 44)">
      <!-- Viewtiauth Cluster -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="484" height="58" rx="6" fill="url(#card-grad)" stroke="#6d28d9" stroke-width="1"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#f5f3ff">Viewtiauth (Synchronized AAA Cluster)</text>
        <text x="14" y="42" font-size="11" fill="#cbd5e1">• Replicated Session Store • AD / LDAP / SAML 2.0 / Entra ID SSO • API Keys</text>
      </g>

      <!-- Viewticore Cluster -->
      <g transform="translate(504, 0)">
        <rect x="0" y="0" width="484" height="58" rx="6" fill="url(#card-grad)" stroke="#6d28d9" stroke-width="1"/>
        <text x="14" y="22" font-size="13" font-weight="700" fill="#f5f3ff">Viewticore (Database CRUD &amp; Models Brain)</text>
        <text x="14" y="42" font-size="11" fill="#cbd5e1">• Central Schema Registry • Active Probing Orchestration • Config CRUD</text>
      </g>
    </g>
  </g>

  <!-- Arrow from Backend to Storage Tier -->
  <g>
    <line x1="550" y1="512" x2="550" y2="538" stroke="#10b981" stroke-width="2"/>
    <polygon points="545,538 550,545 555,538" fill="#10b981"/>
    <rect x="440" y="520" width="220" height="16" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
    <text x="550" y="532" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Database Schemas &amp; Queries ↓</text>
  </g>

  <!-- ==================== 4. TIER 3: VIEWTILOG & VIEWTINETDB STORAGE CLUSTER ==================== -->
  <g transform="translate(40, 546)">
    <!-- Container background -->
    <rect x="0" y="0" width="1020" height="206" rx="10" fill="#02281e" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="12" width="410" height="24" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#ecfdf5" letter-spacing="0.5">TIER 3: INGESTION &amp; TIME-SERIES STORAGE (VIEWTILOG &amp; VIEWTINETDB)</text>
    <text x="990" y="29" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="end">WAL Streaming Replication &amp; Auto-Failover</text>

    <!-- Sub-Cards -->
    <g transform="translate(16, 44)">
      <!-- PRIMARY NODE (x=0) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="440" height="148" rx="8" fill="url(#box-db-prim)" stroke="#059669" stroke-width="1.4"/>
        <rect x="12" y="12" width="130" height="22" rx="4" fill="#047857"/>
        <text x="77" y="27" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">PRIMARY NODE (SITE A)</text>
        
        <text x="14" y="54" font-size="13" font-weight="700" fill="#f0fdf4">Viewtilog Ingestion (Active Master)</text>
        <text x="14" y="70" font-size="10.5" fill="#cbd5e1">• Dhyana 3-Stage ETL: Connectors, Streamers &amp; Decorators</text>
        <text x="14" y="85" font-size="10.5" fill="#cbd5e1">• High-Throughput Ingestion from Viewtimon &amp; Flow feeds</text>
        
        <line x1="14" y1="96" x2="426" y2="96" stroke="#047857" stroke-width="1"/>

        <text x="14" y="114" font-size="13" font-weight="700" fill="#34d399">ViewtinetDB (Primary Master R/W)</text>
        <text x="14" y="130" font-size="10.5" fill="#cbd5e1">• High-Speed Columnar Persistence • Generates WAL Stream</text>
      </g>

      <!-- REPLICATION CHANNEL (In between: x=440 to x=548, width=108) -->
      <g transform="translate(440, 20)">
        <!-- Replication Arrow Right -->
        <line x1="12" y1="36" x2="96" y2="36" stroke="#10b981" stroke-width="2.5"/>
        <polygon points="96,36 88,31 88,41" fill="#10b981"/>

        <!-- Pill badge -->
        <rect x="14" y="46" width="80" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="54" y="60" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">WAL Sync</text>

        <!-- Heartbeat / Health line -->
        <line x1="96" y1="84" x2="12" y2="84" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,3"/>
        <polygon points="12,84 20,79 20,89" fill="#f59e0b"/>
        <rect x="14" y="94" width="80" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
        <text x="54" y="108" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Heartbeat</text>
      </g>

      <!-- SECONDARY / STANDBY NODE (x=548) -->
      <g transform="translate(548, 0)">
        <rect x="0" y="0" width="440" height="148" rx="8" fill="url(#box-db-sec)" stroke="#0284c7" stroke-width="1.4"/>
        <rect x="12" y="12" width="150" height="22" rx="4" fill="#075985"/>
        <text x="87" y="27" font-size="11" font-weight="700" fill="#f0f9ff" text-anchor="middle">SECONDARY NODE (SITE B)</text>

        <text x="14" y="54" font-size="13" font-weight="700" fill="#f0f9ff">Viewtilog Ingestion (Hot-Standby)</text>
        <text x="14" y="70" font-size="10.5" fill="#cbd5e1">• Standby Pipeline Configuration Ready for Promotion</text>
        <text x="14" y="85" font-size="10.5" fill="#cbd5e1">• Automated Health Monitoring &amp; State Synchronization</text>

        <line x1="14" y1="96" x2="426" y2="96" stroke="#0369a1" stroke-width="1"/>

        <text x="14" y="114" font-size="13" font-weight="700" fill="#38bdf8">ViewtinetDB (Hot-Standby Replica)</text>
        <text x="14" y="130" font-size="10.5" fill="#cbd5e1">• Continuous Streaming WAL Receiver • Zero Data Loss Failover</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(40, 762)">
    <rect x="0" y="0" width="1020" height="38" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="510" y="24" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">High Availability in Viewtinet 7.X: Active-Active GUI Cluster (VIP) → Clustered AAA &amp; Core Backend → Streaming WAL Replication across Viewtilog Storage Nodes</text>
  </g>
</svg>
