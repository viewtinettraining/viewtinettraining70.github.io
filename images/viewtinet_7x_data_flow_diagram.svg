<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1020" width="100%" height="100%" style="background-color: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131c2e" stroke-width="0.7"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="box-source" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="box-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#032b45" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="box-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#02281e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="box-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#240e02" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="box-l4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#170933" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1140" height="1020" fill="#090d16"/>
  <rect width="1140" height="1020" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="1060" height="50" rx="8" fill="url(#hdr-grad)" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="26" cy="25" r="6" fill="#38bdf8"/>
    <text x="44" y="31" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Viewtinet 7.X — Operational End-to-End Data Flow</text>
    <rect x="870" y="13" width="174" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="957" y="29" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TELEMETRY PIPELINE</text>
  </g>

  <!-- ==================== 1. SOURCE INFRASTRUCTURE ==================== -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="760" height="96" rx="8" fill="url(#box-source)" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="20" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SOURCE INFRASTRUCTURE (PHYSICAL, VIRTUAL &amp; CLOUD)</text>

    <!-- Source Items -->
    <g transform="translate(16, 30)">
      <!-- Item 1: Live Wire -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="232" height="52" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-size="12" font-weight="700" fill="#f1f5f9">Live Wire Traffic</text>
        <text x="14" y="38" font-size="10" fill="#94a3b8">SPAN / Optical TAP / Inline Spans</text>
      </g>

      <!-- Item 2: Devices -->
      <g transform="translate(248, 0)">
        <rect x="0" y="0" width="236" height="52" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-size="12" font-weight="700" fill="#f1f5f9">Routers, Switches &amp; Firewalls</text>
        <text x="14" y="38" font-size="10" fill="#94a3b8">SNMP MIBs, Flow Telemetry, Syslog</text>
      </g>

      <!-- Item 3: Servers -->
      <g transform="translate(496, 0)">
        <rect x="0" y="0" width="232" height="52" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="22" font-size="12" font-weight="700" fill="#f1f5f9">Servers &amp; Cloud Apps</text>
        <text x="14" y="38" font-size="10" fill="#94a3b8">WMI, Cloud APIs, Active Targets</text>
      </g>
    </g>
  </g>

  <!-- ==================== 4. GOVERNANCE SIDEBAR (RIGHT COLUMN) ==================== -->
  <g transform="translate(820, 90)">
    <rect x="0" y="0" width="280" height="746" rx="10" fill="url(#box-l4)" stroke="#8b5cf6" stroke-width="1.5"/>
    <!-- Badge -->
    <rect x="14" y="16" width="252" height="26" rx="5" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
    <text x="140" y="33" font-size="11" font-weight="700" fill="#ede9fe" text-anchor="middle">ADMINISTRATION &amp; SECURITY</text>

    <!-- Viewtimanager -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="252" height="290" rx="7" fill="url(#card-grad)" stroke="#6d28d9" stroke-width="1"/>
      <text x="14" y="24" font-size="14" font-weight="700" fill="#f5f3ff">Viewtimanager</text>
      <text x="14" y="42" font-size="11" font-weight="600" fill="#a78bfa">Operations Orchestrator</text>
      
      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Central Asset Inventory</text>
      <text x="14" y="86" font-size="10" fill="#94a3b8">  Automated subnet/device discovery</text>

      <text x="14" y="112" font-size="11" fill="#cbd5e1">• Network Config Manager (NCM)</text>
      <text x="14" y="128" font-size="10" fill="#94a3b8">  Automated backup &amp; diff of configs</text>

      <text x="14" y="154" font-size="11" fill="#cbd5e1">• Scheduled Tasks &amp; Subtasks</text>
      <text x="14" y="170" font-size="10" fill="#94a3b8">  Cron-based remote CLI command flows</text>

      <text x="14" y="196" font-size="11" fill="#cbd5e1">• Plugin Lifecycle (VSDB)</text>
      <text x="14" y="212" font-size="10" fill="#94a3b8">  Data Broker connectors &amp; pipelines</text>

      <text x="14" y="238" font-size="11" fill="#cbd5e1">• Appliance Upgrades</text>
      <text x="14" y="254" font-size="10" fill="#94a3b8">  Signature packs &amp; node management</text>
    </g>

    <!-- Viewtiauth -->
    <g transform="translate(14, 360)">
      <rect x="0" y="0" width="252" height="356" rx="7" fill="url(#card-grad)" stroke="#6d28d9" stroke-width="1"/>
      <text x="14" y="24" font-size="14" font-weight="700" fill="#f5f3ff">Viewtiauth</text>
      <text x="14" y="42" font-size="11" font-weight="600" fill="#a78bfa">Identity &amp; Governance</text>

      <text x="14" y="70" font-size="11" fill="#cbd5e1">• Centralized AAA System</text>
      <text x="14" y="86" font-size="10" fill="#94a3b8">  Authentication, Authorization &amp; Audit</text>

      <text x="14" y="112" font-size="11" fill="#cbd5e1">• Role-Based Access Control (RBAC)</text>
      <text x="14" y="128" font-size="10" fill="#94a3b8">  Granular permissions per user &amp; tenant</text>

      <text x="14" y="154" font-size="11" fill="#cbd5e1">• External Identity &amp; SSO</text>
      <text x="14" y="170" font-size="10" fill="#94a3b8">  Active Directory, LDAP, SAML 2.0 &amp; Entra ID</text>

      <text x="14" y="196" font-size="11" fill="#cbd5e1">• Multi-Factor Auth (MFA / 2FA)</text>
      <text x="14" y="212" font-size="10" fill="#94a3b8">  TOTP security &amp; session timeout governance</text>

      <text x="14" y="238" font-size="11" fill="#cbd5e1">• Managed API Keys</text>
      <text x="14" y="254" font-size="10" fill="#94a3b8">  Token lifecycle &amp; secure programmatic access</text>

      <text x="14" y="280" font-size="11" fill="#cbd5e1">• Local Authentication</text>
      <text x="14" y="296" font-size="10" fill="#94a3b8">  Bcrypt salted credentials &amp; RSA encryption</text>
    </g>
  </g>

  <!-- Flow Arrow: Source to Layer 1 -->
  <g>
    <line x1="260" y1="186" x2="260" y2="218" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="255,218 260,225 265,218" fill="#38bdf8"/>
    <line x1="530" y1="186" x2="530" y2="218" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="525,218 530,225 535,218" fill="#38bdf8"/>
  </g>

  <!-- ==================== 2. LAYER 1: DATA COLLECTION ==================== -->
  <g transform="translate(40, 226)">
    <rect x="0" y="0" width="760" height="156" rx="10" fill="url(#box-l1)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Badge -->
    <rect x="16" y="12" width="330" height="24" rx="4" fill="#075985" stroke="#7dd3fc" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#f0f9ff" letter-spacing="0.5">LAYER 1: DATA COLLECTION &amp; INGESTION LAYER</text>

    <!-- Sub-Cards -->
    <g transform="translate(16, 44)">
      <!-- Viewtimon Core Probe Card (460px width) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="460" height="98" rx="6" fill="url(#card-grad)" stroke="#0284c7" stroke-width="1.2"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#f0f9ff">Viewtimon (Wire-Speed DPI &amp; Active Probing Engine)</text>
        <text x="14" y="38" font-size="10.5" fill="#cbd5e1">• High-Performance Packet Inspection (DPI via DPDK &amp; Hugepages)</text>
        <text x="14" y="53" font-size="10.5" fill="#cbd5e1">• Layer 7 Application Classification • North-South &amp; East-West Traffic</text>
        <text x="14" y="68" font-size="10.5" fill="#cbd5e1">• QoE &amp; Latency KPIs • VoIP Analysis (MOS, Jitter, Packet Loss)</text>
        <text x="14" y="83" font-size="10.5" fill="#cbd5e1">• Viewtify QoS Policies • Active Synthetic Probes (ICMP, DHCP, DNS, HTTP)</text>
      </g>

      <!-- Telemetry Ingestion & Streams (256px width) -->
      <g transform="translate(472, 0)">
        <rect x="0" y="0" width="256" height="98" rx="6" fill="url(#card-grad)" stroke="#0369a1" stroke-width="1"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#f0f9ff">Telemetry Ingestion &amp; Streams</text>
        <text x="14" y="38" font-size="10.5" fill="#cbd5e1">• Flow Feeds: NetFlow, IPFIX, sFlow</text>
        <text x="14" y="53" font-size="10.5" fill="#cbd5e1">• SNMPv1/v2c/v3 Polling &amp; Traps</text>
        <text x="14" y="68" font-size="10.5" fill="#cbd5e1">• High-Capacity Syslog Receiver</text>
        <text x="14" y="83" font-size="10.5" fill="#cbd5e1">• WMI &amp; Cloud Web Service APIs</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow: Layer 1 to Layer 2 -->
  <g>
    <line x1="260" y1="382" x2="260" y2="414" stroke="#10b981" stroke-width="2"/>
    <polygon points="255,414 260,421 265,414" fill="#10b981"/>
    <rect x="210" y="394" width="100" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
    <text x="260" y="406" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Raw Streams ↓</text>

    <line x1="530" y1="382" x2="530" y2="414" stroke="#10b981" stroke-width="2"/>
    <polygon points="525,414 530,421 535,414" fill="#10b981"/>
    <rect x="475" y="394" width="110" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
    <text x="530" y="406" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle">Flows &amp; Events ↓</text>
  </g>

  <!-- ==================== 3. LAYER 2: MEDIATION & ETL PIPELINES (VIEWTILOG) ==================== -->
  <g transform="translate(40, 422)">
    <rect x="0" y="0" width="760" height="188" rx="10" fill="url(#box-l2)" stroke="#10b981" stroke-width="1.5"/>
    <!-- Badge -->
    <rect x="16" y="12" width="410" height="24" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#ecfdf5" letter-spacing="0.5">LAYER 2: MEDIATION &amp; TIME-SERIES STORAGE (VIEWTILOG)</text>

    <!-- 3-STAGE ETL PIPELINE EXECUTED BY DHYANA -->
    <g transform="translate(16, 44)">
      <!-- Stage 1: Extraction -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="130" rx="6" fill="url(#card-grad)" stroke="#047857" stroke-width="1.2"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#ecfdf5">1. Extraction (Dhyana)</text>
        <text x="14" y="34" font-size="10" font-weight="600" fill="#34d399">Connectors &amp; Streamers</text>
        <text x="14" y="54" font-size="10" fill="#cbd5e1">• Scheduled Connectors (Pull)</text>
        <text x="14" y="68" font-size="10" fill="#cbd5e1">• Real-Time Streamers (Push)</text>
        <text x="14" y="82" font-size="10" fill="#cbd5e1">• CPU-Pinned Pipeline Workers</text>
        <text x="14" y="96" font-size="10" fill="#cbd5e1">• Ingests NetFlow, Syslog, SNMP</text>
        <text x="14" y="112" font-size="9.5" fill="#94a3b8">  Passes raw records to transform</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <line x1="220" y1="65" x2="245" y2="65" stroke="#34d399" stroke-width="1.8"/>
      <polygon points="245,65 239,62 239,68" fill="#34d399"/>

      <!-- Stage 2: Transformation -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="224" height="130" rx="6" fill="url(#card-grad)" stroke="#047857" stroke-width="1.2"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#ecfdf5">2. Transform (Dhyana)</text>
        <text x="14" y="34" font-size="10" font-weight="600" fill="#34d399">Grid Handlers &amp; Decorators</text>
        <text x="14" y="54" font-size="10" fill="#cbd5e1">• Net Decorator (IPv4 / IPv6)</text>
        <text x="14" y="68" font-size="9.5" fill="#94a3b8">  Subnet mapping, ASN &amp; Country</text>
        <text x="14" y="84" font-size="10" fill="#cbd5e1">• CSV / Table Decorator</text>
        <text x="14" y="98" font-size="9.5" fill="#94a3b8">  Dynamic business context lookups</text>
        <text x="14" y="114" font-size="10" fill="#38bdf8">• Inventory Decorator (7.X)</text>
        <text x="14" y="126" font-size="9" fill="#94a3b8">  Enriches with Viewtimanager data</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <line x1="474" y1="65" x2="499" y2="65" stroke="#34d399" stroke-width="1.8"/>
      <polygon points="499,65 493,62 493,68" fill="#34d399"/>

      <!-- Stage 3: Loading & Database Governance -->
      <g transform="translate(504, 0)">
        <!-- ViewtinetDB Loading -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="224" height="60" rx="6" fill="url(#card-grad)" stroke="#047857" stroke-width="1.2"/>
          <text x="14" y="18" font-size="12" font-weight="700" fill="#ecfdf5">3. Loading (Producers)</text>
          <text x="14" y="32" font-size="9.5" fill="#34d399">ViewtinetDB Storage</text>
          <text x="14" y="48" font-size="9" fill="#cbd5e1">High-Speed Columnar Persistence</text>
        </g>

        <!-- Viewticore Brain -->
        <g transform="translate(0, 68)">
          <rect x="0" y="0" width="224" height="62" rx="6" fill="url(#card-grad)" stroke="#047857" stroke-width="1.2"/>
          <text x="14" y="18" font-size="12" font-weight="700" fill="#ecfdf5">Viewticore (Core Brain)</text>
          <text x="14" y="32" font-size="9.5" fill="#34d399">Database CRUD &amp; Schemas</text>
          <text x="14" y="48" font-size="9" fill="#cbd5e1">Data Models, Registry &amp; Migrations</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Flow Arrow: Viewtilog to Viewtisight -->
  <g>
    <line x1="420" y1="610" x2="420" y2="642" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="415,642 420,649 425,642" fill="#f59e0b"/>
    <rect x="330" y="622" width="180" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="420" y="634" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Queries, KPIs &amp; Alarms Stream ↓</text>
  </g>

  <!-- ==================== 4. LAYER 3: VIEWTISIGHT ==================== -->
  <g transform="translate(40, 650)">
    <rect x="0" y="0" width="760" height="186" rx="10" fill="url(#box-l3)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Badge -->
    <rect x="16" y="12" width="410" height="24" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="24" y="28" font-size="11" font-weight="700" fill="#fef3c7" letter-spacing="0.5">LAYER 3: VISUALIZATION, ANALYTICS &amp; CONTROL CENTER</text>

    <!-- Sub-Cards -->
    <g transform="translate(16, 44)">
      <!-- Viewtisight Analytics Card (354px) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="354" height="128" rx="6" fill="url(#card-grad)" stroke="#b45309" stroke-width="1.2"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#fffbeb">Viewtisight Operations Console</text>
        <text x="14" y="38" font-size="10.5" fill="#cbd5e1">• Multi-Layer Dashboards (Card Stacking &amp; Layer Events)</text>
        <text x="14" y="53" font-size="10.5" fill="#cbd5e1">• Preconfigured &amp; Customized Operation Dashboards</text>
        <text x="14" y="68" font-size="10.5" fill="#cbd5e1">• Card Subscription Reusability (1-Click Query Copying)</text>
        <text x="14" y="83" font-size="10.5" fill="#cbd5e1">• Interactive Dimensional Drill-Downs &amp; Forensics</text>
        <text x="14" y="98" font-size="10.5" fill="#cbd5e1">• Dynamic Topology Maps &amp; Automated PDF Reporter</text>
        <text x="14" y="113" font-size="10" fill="#38bdf8">• ViewtiAI Copilot: Contextual Metric &amp; KPI Composer</text>
      </g>

      <!-- Control Center Card (360px) -->
      <g transform="translate(368, 0)">
        <rect x="0" y="0" width="360" height="128" rx="6" fill="url(#card-grad)" stroke="#b45309" stroke-width="1.2"/>
        <text x="14" y="20" font-size="13" font-weight="700" fill="#fffbeb">Control Center (Alarms &amp; Notifications)</text>
        <text x="14" y="38" font-size="10.5" fill="#cbd5e1">• Active Alarms Monitoring Panel &amp; Acknowledgment</text>
        <text x="14" y="53" font-size="10.5" fill="#cbd5e1">• Granular Threshold Checks &amp; Condition Rule Builder</text>
        <text x="14" y="68" font-size="10.5" fill="#cbd5e1">• Auditable Chronological Events Log &amp; History</text>
        <text x="14" y="84" font-size="11" font-weight="600" fill="#fbbf24">Multi-Channel Operational Notifications:</text>
        <text x="14" y="100" font-size="10" fill="#fef3c7">• Email Alerts • SNMP Traps • Syslog Events • Webhooks / ITSM</text>
        <text x="14" y="115" font-size="10" fill="#94a3b8">Automated incident trigger &amp; external ticketing integration</text>
      </g>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(40, 856)">
    <rect x="0" y="0" width="1060" height="40" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="530" y="25" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Viewtinet 7.X Data Flow: Infrastructure → Collection (Viewtimon &amp; Telemetry Ingestion) → Viewtilog (Dhyana ETL &amp; Viewticore DB) → Viewtisight (Analytics &amp; Control Center Alarms) | Governed by Viewtimanager &amp; Viewtiauth</text>
  </g>
</svg>
